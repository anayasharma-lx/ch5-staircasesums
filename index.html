<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Staircase Sums — Ganita Prakash Grade 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#04060a;--deep:#07090e;--surface:#0c101a;--panel:#101520;
  --border:#182030;--border2:#202c40;
  --blue:#3890f8;--blue-dim:#0a2848;--blue-glow:rgba(56,144,248,.22);
  --mirror:#a0c8f8;--mirror-glow:rgba(160,200,248,.15);
  --red:#f04040;--red-glow:rgba(240,64,64,.2);
  --green:#30e090;--green-glow:rgba(48,224,144,.18);
  --amber:#f8b830;--amber-glow:rgba(248,184,48,.15);
  --white:#d8eaff;--dim:#6a90b8;--dimmer:#384858;
  --serif:'Instrument Serif',Georgia,serif;--mono:'Space Mono',ui-monospace,monospace;
}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:var(--mono);background:var(--void);color:var(--white);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;position:fixed;inset:0}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);pointer-events:none;z-index:1}
.top{position:relative;z-index:10;border-bottom:1px solid var(--border);background:var(--deep);height:46px;flex-shrink:0;display:flex;align-items:center;padding:0 18px;gap:14px}
.top-badge{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);border-right:1px solid var(--border);padding-right:14px;font-family:var(--mono)}
.tb-num{width:18px;height:18px;border-radius:2px;background:rgba(56,144,248,.15);border:1px solid var(--blue-dim);color:var(--blue);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.top-title{font-family:var(--serif);font-size:16px;color:var(--white);flex:1}
.top-controls{display:flex;align-items:center;gap:14px}
.tc-row{display:flex;align-items:center;gap:8px}
.tc-lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
input[type=range]{width:100px;height:2px;-webkit-appearance:none;background:var(--border2);border-radius:1px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer}
.tc-val{font-size:16px;font-weight:700;font-family:var(--mono);color:var(--blue);min-width:24px;text-align:right}
.morph-toggle{display:flex;gap:0;background:var(--surface);border:1px solid var(--border2);border-radius:2px;overflow:hidden}
.mt-btn{padding:6px 12px;border:none;background:transparent;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim);cursor:pointer;transition:all .14s;letter-spacing:.04em}
.mt-btn:hover{color:var(--white)}.mt-btn.active{background:rgba(56,144,248,.2);color:var(--blue)}
.main{flex:1;display:grid;grid-template-columns:1fr 280px;overflow:hidden;min-height:0;position:relative;z-index:5}
.canvas-area{overflow:hidden;background:var(--void);display:flex;flex-direction:column;border-right:1px solid var(--border)}
#cvs{display:block;width:100%;flex:1}
.sum-display{padding:10px 16px;border-top:1px solid var(--border);background:var(--deep);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--dim);flex-shrink:0}
.sd-seq{color:var(--blue)}.sd-eq{color:var(--dim)}
.sd-total{font-size:24px;font-weight:700;color:var(--blue);text-shadow:0 0 18px var(--blue-glow)}
.sd-formula{font-size:11px;color:var(--dim)}
.right{display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
.r-header{padding:10px 12px;border-bottom:1px solid var(--border);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);flex-shrink:0}
.r-sub{font-size:10px;color:var(--dimmer);margin-top:3px;line-height:1.5}
.ladder-grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.lad-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;border:1px solid var(--border);color:var(--dim);background:var(--surface);cursor:pointer;transition:all .14s;border-radius:2px;position:relative}
.lad-cell:hover{border-color:var(--blue);color:var(--white)}
.lad-cell.cur{background:rgba(56,144,248,.2);border-color:var(--blue);color:var(--blue);box-shadow:0 0 10px var(--blue-glow)}
.lad-cell.pow2{color:var(--red);border-color:#301010;background:rgba(240,64,64,.08)}
.lad-cell.pow2::after{content:'2n';position:absolute;top:1px;right:2px;font-size:10px;color:var(--red);opacity:.6}
.legend{display:flex;gap:10px;padding:8px 10px;border-top:1px solid var(--border);flex-shrink:0}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--dim)}
.leg-sw{width:10px;height:10px;border-radius:1px}
.leg-sw.cur{background:var(--blue);box-shadow:0 0 6px var(--blue-glow)}.leg-sw.pow{background:rgba(240,64,64,.3);border:1px solid var(--red)}
.insight-bottom{padding:8px 10px;border-top:1px solid var(--border);font-size:10px;color:var(--dimmer);font-family:var(--mono);line-height:1.65;flex-shrink:0}
.insight-bottom strong{color:var(--amber)}

@media(max-width:768px){
  html,body{overflow:auto;height:auto}
  body{position:static;display:flex;flex-direction:column;min-height:100dvh}
  .top{height:auto;flex-wrap:wrap;padding:8px 14px;gap:8px}
  .top-badge{padding-right:10px}
  .top-controls{flex-wrap:wrap;gap:8px}
  input[type=range]{width:80px}
  .morph-toggle{margin-left:0}
  .main{grid-template-columns:1fr;grid-template-rows:320px auto;overflow:visible}
  .canvas-area{border-right:none;border-bottom:1px solid var(--border);min-height:320px;overflow:visible}
  #cvs{min-height:260px;flex:1}
  .right{overflow:visible;max-height:none}
  .ladder-grid{max-height:200px;overflow-y:auto}
  .sum-display{flex-wrap:wrap;gap:6px;font-size:12px}
}
@media(max-width:480px){
  .canvas-area{min-height:260px}
  #cvs{min-height:200px}
  .ladder-grid{max-height:160px}
}</style>
</head>
<body>
<div class="top">
  <div class="top-badge"><div class="tb-num">5</div>CH·05 §5.1</div>
  <div class="top-title">Staircase Sums</div>
  <div class="top-controls">
    <div class="tc-row"><span class="tc-lbl">Start</span><input type="range" id="start" min="1" max="20" value="3"><span class="tc-val" id="start-v">3</span></div>
    <div class="tc-row"><span class="tc-lbl">Length</span><input type="range" id="length" min="2" max="10" value="4"><span class="tc-val" id="length-v">4</span></div>
    <div class="morph-toggle"><button class="mt-btn active" data-mode="stair">Staircase</button><button class="mt-btn" data-mode="rect">Rectangle</button></div>
  </div>
</div>
<div class="main">
  <div class="canvas-area">
    <canvas id="cvs"></canvas>
    <div class="sum-display" id="sum-display"></div>
  </div>
  <div class="right">
    <div class="r-header">Numbers 1–60 — click to load<div class="r-sub">Red = powers of 2. No staircase can sum to them.</div></div>
    <div class="ladder-grid" id="ladder-grid"></div>
    <div class="legend"><div class="leg-item"><div class="leg-sw cur"></div>current sum</div><div class="leg-item"><div class="leg-sw pow"></div>power of 2</div></div>
    <div class="insight-bottom"><strong>Why 2n fails:</strong> staircase sums to L·a + L(L−1)/2 = L·(2a+L−1)/2. Powers of 2 have no odd factor > 1 — so no valid L.</div>
  </div>
</div>
<script>
let startVal=3,lengthVal=4,mode='stair';
const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');
const PR=Math.min(window.devicePixelRatio||1,2);
document.getElementById('start').addEventListener('input',e=>{startVal=+e.target.value;document.getElementById('start-v').textContent=startVal;render();});
document.getElementById('length').addEventListener('input',e=>{lengthVal=+e.target.value;document.getElementById('length-v').textContent=lengthVal;render();});
document.querySelectorAll('.mt-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.mt-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render();});});
function computeSum(){return Array.from({length:lengthVal},(_,i)=>startVal+i).reduce((a,b)=>a+b,0);}
function render(){
  const wrap=cvs.parentElement,W=wrap.clientWidth,H=wrap.clientHeight-document.querySelector('.sum-display').offsetHeight-2;
  if(W<=0||H<=0)return;
  cvs.width=W*PR;cvs.height=H*PR;cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.resetTransform();ctx.scale(PR,PR);
  const seq=Array.from({length:lengthVal},(_,i)=>startVal+i),sum=computeSum(),maxN=startVal+lengthVal-1,rectW=2*startVal+lengthVal-1;
  const PAD=24,DOT=9,GAP=4,CELL=DOT+GAP;
  const stairWidth=maxN*CELL+PAD*2,stairHeight=lengthVal*CELL+PAD*2;
  const rectWidthPx=rectW*CELL+PAD*2,rectHeightPx=lengthVal*CELL+PAD*2;
  const maxWidth=mode==='stair'?stairWidth:rectWidthPx,maxHeight=mode==='stair'?stairHeight:rectHeightPx;
  const scaleX=W/maxWidth,scaleY=H/maxHeight,sc=Math.min(scaleX,scaleY,1.5);
  const offX=(W-(maxWidth*sc))/2,offY=(H-(maxHeight*sc))/2;
  function tx(x){return offX+x*sc;}function ty(y){return offY+y*sc;}
  const d=DOT*sc,g=GAP*sc,c=CELL*sc;
  ctx.fillStyle='#04060a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(200,220,255,.15)';[[.1,.1],[.3,.05],[.6,.08],[.8,.12],[.15,.9],[.5,.85],[.9,.7]].forEach(([fx,fy])=>{ctx.beginPath();ctx.arc(fx*W,fy*H,1,0,Math.PI*2);ctx.fill();});
  if(mode==='stair'){
    seq.forEach((count,i)=>{const row=lengthVal-1-i,y=ty(PAD*sc+row*c);ctx.font=`bold ${Math.round(11*sc)}px Space Mono,monospace`;ctx.fillStyle='rgba(56,144,248,.5)';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(count,tx(PAD*sc-6),y+d/2);for(let j=0;j<count;j++){const x=tx(PAD*sc+j*c);ctx.shadowColor='#3890f8';ctx.shadowBlur=d*0.6;ctx.beginPath();ctx.arc(x+d/2,y+d/2,d/2,0,Math.PI*2);ctx.fillStyle='#3890f8';ctx.fill();ctx.shadowBlur=0;}});
    ctx.strokeStyle='rgba(56,144,248,.2)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();for(let i=0;i<lengthVal;i++){const count=seq[lengthVal-1-i],y=ty(PAD*sc+i*c),xEnd=tx(PAD*sc+count*c);if(i===0){ctx.moveTo(tx(PAD*sc),y);}else{ctx.lineTo(tx(PAD*sc+seq[lengthVal-i]*c),y);}ctx.lineTo(xEnd,y);ctx.lineTo(xEnd,y+c);}ctx.lineTo(tx(PAD*sc),ty(PAD*sc+lengthVal*c));ctx.closePath();ctx.stroke();ctx.setLineDash([]);
  } else {
    for(let i=0;i<lengthVal;i++){const origCount=seq[lengthVal-1-i],y=ty(PAD*sc+i*c);for(let j=0;j<rectW;j++){const x=tx(PAD*sc+j*c),isOrig=j<origCount;if(isOrig){ctx.shadowColor='#3890f8';ctx.shadowBlur=d*0.5;ctx.beginPath();ctx.arc(x+d/2,y+d/2,d/2,0,Math.PI*2);ctx.fillStyle='#3890f8';ctx.fill();ctx.shadowBlur=0;}else{ctx.beginPath();ctx.arc(x+d/2,y+d/2,d/2,0,Math.PI*2);ctx.fillStyle='rgba(160,200,248,.3)';ctx.fill();}}}
    const rW_px=rectW*c,rH_px=lengthVal*c,rx=tx(PAD*sc),ry=ty(PAD*sc);
    ctx.font=`bold ${Math.round(10*sc)}px Space Mono,monospace`;ctx.fillStyle='rgba(160,200,248,.6)';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(rectW+' per row',rx+rW_px/2,ry+rH_px+8*sc);
    ctx.save();ctx.translate(rx-14*sc,ry+rH_px/2);ctx.rotate(-Math.PI/2);ctx.fillText(lengthVal+' rows',0,0);ctx.restore();
    ctx.strokeStyle='rgba(56,144,248,.25)';ctx.lineWidth=1;ctx.setLineDash([4,3]);const divX=tx(PAD*sc+seq[0]*c);ctx.beginPath();ctx.moveTo(divX,ty(PAD*sc));ctx.lineTo(divX,ty(PAD*sc+lengthVal*c));ctx.stroke();ctx.setLineDash([]);
    ctx.font=`italic ${Math.round(10*sc)}px Instrument Serif,serif`;ctx.fillStyle='rgba(56,144,248,.5)';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('original',tx(PAD*sc+seq[0]*c/2),ty(PAD*sc)-4*sc);ctx.fillStyle='rgba(160,200,248,.4)';ctx.fillText('mirror',tx(PAD*sc+seq[0]*c+(rectW-seq[0])*c/2),ty(PAD*sc)-4*sc);
  }
  const sd=document.getElementById('sum-display');
  if(mode==='stair'){sd.innerHTML=`<span class="sd-seq">${seq.join(' + ')}</span><span class="sd-eq">=</span><span class="sd-total">${sum}</span>`;}
  else{sd.innerHTML=`<span class="sd-formula">${lengthVal} rows × ${rectW} cols ÷ 2 =</span><span class="sd-total">${sum}</span>`;}
  document.querySelectorAll('.lad-cell').forEach(c=>{c.classList.toggle('cur',+c.dataset.n===sum);});
}
function buildLadder(){
  const grid=document.getElementById('ladder-grid');
  for(let n=1;n<=60;n++){const isPow2=(n&(n-1))===0;const cell=document.createElement('div');cell.className='lad-cell'+(isPow2?' pow2':'');cell.dataset.n=n;cell.textContent=n;cell.addEventListener('click',()=>{if(isPow2){cell.style.animation='none';void cell.offsetWidth;cell.style.animation='shake .4s';return;}let found=null;for(let L=2;L*(L-1)/2<n;L++){const num=n-L*(L-1)/2;if(num>0&&num%L===0){found={start:num/L,length:L};break;}}if(found){startVal=found.start;lengthVal=found.length;document.getElementById('start').value=startVal;document.getElementById('length').value=lengthVal;document.getElementById('start-v').textContent=startVal;document.getElementById('length-v').textContent=lengthVal;render();}});grid.appendChild(cell);}
  const ks=document.createElement('style');ks.textContent='@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';document.head.appendChild(ks);
}
new ResizeObserver(()=>{render();}).observe(cvs.parentElement);
buildLadder();render();
</script>
</body>
</html>
